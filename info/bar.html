<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>The Bar | Lily & Cody</title><style>:root{--sage:#AFB39D;--light:#CBCCBB;--olive:#8F927B;--dark:#5A5E4B;--cream:#F7F5EF;--paper:#F1EFE6;--ink:#282A24;--line:rgba(90,94,75,.22)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Georgia,"Times New Roman",serif;background:#fbfaf6;color:var(--ink);line-height:1.65}
a{color:inherit}.top{background:rgba(247,245,239,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.topin{width:min(100% - 32px,920px);margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{letter-spacing:.16em;text-decoration:none}.back{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dark)}
.hero{background:linear-gradient(rgba(247,245,239,.80),rgba(247,245,239,.88)),url("../assets/qr-card-template.png") center/cover no-repeat;padding:76px 20px;text-align:center;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2.5rem,8vw,4.5rem);font-weight:400;letter-spacing:.08em;margin:0}.script{font-family:"Brush Script MT","Segoe Script",cursive;color:var(--dark);font-size:2rem;margin-top:6px}
.wrap{width:min(100% - 36px,920px);margin:0 auto;padding:58px 0 80px}.card{background:#fafaf6;border:1px solid #afb39d;padding:30px;margin-bottom:20px}.card h2{font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;color:var(--dark);margin:0 0 14px}.card h3{font-weight:400;font-size:1.2rem;margin:0 0 8px}.card p{margin:8px 0}.image{width:100%;max-height:430px;object-fit:cover;display:block;border:1px solid #afb39d;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.item{background:white;border:1px solid var(--line);padding:20px}.item h3{margin:0 0 6px}.small{font-size:.86rem;color:#62655b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;border:1px solid var(--dark);background:var(--dark);color:white;padding:11px 15px;text-decoration:none;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem}.btn.secondary{background:white;color:var(--dark)}
.note{border-left:3px solid var(--olive);background:var(--paper);padding:16px 18px;margin:20px 0}.list{padding-left:20px}.list li{margin:8px 0}.footer{background:var(--dark);color:white;text-align:center;padding:34px 20px;letter-spacing:.12em}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding-top:38px}.hero{padding:56px 18px}.topin{min-height:58px}.brand{font-size:.82rem}}</style></head>
<body>
<header class="top"><div class="topin"><a class="brand" href="../">LILY & CODY</a><a class="back" href="../#information">← Wedding information</a></div></header>
<section class="hero"><h1>The Bar</h1><div class="script">A very important detail</div></section>
<main class="wrap">
  <div class="card"><h2>Card only</h2><p>Dunedin operates a <strong>cashless bar</strong>, so please bring a debit or credit card with you.</p></div>
  <div class="note">A full drinks menu can be added here once Lily & Cody have the final venue menu.</div></main>
<footer class="footer">LILY & CODY · 14 AUGUST 2027</footer>
<script>if(!localStorage.getItem('lc_invite_code')){location.replace('../');}</script>
</body></html>
